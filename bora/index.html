<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BORAAA ACELERAAAR · V8</title>
<meta property="og:title" content="BORAAA ACELERAAAR · V8 Aceleração">
<meta property="og:image" content="https://aceleracao.v8.ia.br/assets/v8-socios-og.jpg">
<link rel="icon" href="../assets/v8-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;800&family=Inter:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--or:#FF6A00;--bg:#0B0B0D}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#stage{width:1920px;height:1080px;position:relative;flex:none;overflow:hidden;
 background:radial-gradient(900px 600px at 82% 55%,rgba(255,106,0,.16) 0%,rgba(255,106,0,0) 70%),linear-gradient(180deg,#0E0E11 0%,#08080A 100%);font-family:Outfit,Arial,sans-serif;transform-origin:center}
.speed{position:absolute;inset:-50%;background:repeating-linear-gradient(-12deg,transparent 0 118px,rgba(255,255,255,.025) 118px 119px);animation:run 6s linear infinite}
@keyframes run{to{transform:translateX(-480px)}}
.grain{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.55) 100%)}
.logo{position:absolute;top:90px;left:140px;height:110px;filter:drop-shadow(0 0 0 rgba(255,106,0,0));transition:filter .08s}
.logo.hit{filter:drop-shadow(0 0 18px rgba(255,106,0,.55))}
.row{position:absolute;left:140px;top:0;bottom:0;display:flex;align-items:center;gap:40px}
.txt{display:flex;flex-direction:column}
.eyebrow{font-family:Inter,Arial,sans-serif;font-weight:600;font-size:26px;letter-spacing:10px;color:#8E8E96;text-transform:uppercase;margin-bottom:28px;display:flex;align-items:center;gap:20px}
.eyebrow i{width:56px;height:3px;background:var(--or);display:block}
h1{margin:0;font-weight:800;font-size:184px;line-height:.95;letter-spacing:-5px;
 background:linear-gradient(100deg,#FFFFFF 0%,#FFFFFF 38%,#C9C9CE 46%,#FFFFFF 54%,#E4E4E8 100%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sheen 5s ease-in-out infinite}
h1 span{display:block;font-weight:300;letter-spacing:-3px}
h1 b{font-weight:800;color:var(--or);-webkit-text-fill-color:var(--or)}
@keyframes sheen{0%{background-position:100% 0}60%,100%{background-position:-50% 0}}
.rule{width:100%;height:2px;margin-top:40px;background:linear-gradient(90deg,var(--or) 0 140px,rgba(255,255,255,.12) 140px)}
.sig{font-family:Inter,Arial,sans-serif;font-weight:500;font-size:24px;letter-spacing:6px;color:#6E6E78;text-transform:uppercase;margin-top:22px}
#flag{width:440px;height:480px;flex:none}
.bar{position:absolute;left:0;bottom:0;width:100%;height:6px;background:linear-gradient(90deg,var(--or),#FF8A33 50%,var(--or))}
#bolt,#fx{position:absolute;inset:0;pointer-events:none}
#flash{position:absolute;inset:0;background:radial-gradient(circle at 50% 0%,rgba(255,180,110,.5),rgba(255,106,0,0) 70%);opacity:0;pointer-events:none;mix-blend-mode:screen}
#stage.v{width:1080px;height:1920px}
#stage.v .logo{left:50%;transform:translateX(-50%);top:160px;height:130px}
#stage.v .row{left:0;right:0;flex-direction:column;justify-content:center;gap:10px;text-align:center}
#stage.v h1{font-size:150px;letter-spacing:-4px}
#stage.v .eyebrow{justify-content:center}
#stage.v .txt{align-items:center}
#stage.v .rule{width:640px}
#stage.v #flag{width:560px;height:610px;margin-left:120px}
#confetti{position:fixed;inset:0;pointer-events:none;width:100vw;height:100vh}
</style>
</head>
<body>
<div id="wrap"><div id="stage">
<div class="speed"></div><div class="grain"></div>
<canvas id="bolt" width="1920" height="1080"></canvas>
<img class="logo" id="logo" src="../assets/v8-logo.png" alt="V8 Aceleração">
<div class="row">
<div class="txt"><p class="eyebrow"><i></i>V8 Aceleração</p><h1>BORAAA<span>ACELERA<b>AAA</b>R</span></h1><div class="rule"></div><p class="sig">Aquisição qualificada · Processo comercial</p></div>
<canvas id="flag" width="880" height="960"></canvas>
</div>
<div class="bar"></div>
<div id="flash"></div>
</div></div>
<canvas id="confetti"></canvas>
<script>
const stage=document.getElementById('stage');
let SW=1920,SH=1080;
function fit(){const v=innerHeight>innerWidth*1.1;stage.classList.toggle('v',v);SW=v?1080:1920;SH=v?1920:1080;bc.width=SW;bc.height=SH;const s=Math.min(innerWidth/SW,innerHeight/SH);stage.style.transform='scale('+s+')'}

/* ---------- bandeira 3D ---------- */
const fc=document.getElementById('flag'),fx=fc.getContext('2d');fx.scale(2,2);
const FW=330,FH=230,X0=50,Y0=60,C=8,R=6,S=6,N=C*S,M=R*S;
function P(u,v,t){const ph=2*Math.PI*1.25*u-0.6-t*4.2,amp=Math.pow(u,.9);
 const z=Math.sin(ph)*46*amp;let y=Y0+v*FH*(1-.1*u)+Math.sin(ph+.9)*26*amp+u*14;
 const x=X0+u*FW-Math.abs(z)*.25*u;y+=-z*.18*(v-.5);return[x,y]}
function shade(u,t){const ph=2*Math.PI*1.25*u-0.6-t*4.2;return Math.max(.35,Math.min(1.15,.86+.42*Math.cos(ph)*Math.pow(u,.9)))}
function drawFlag(t){
 fx.clearRect(0,0,440,480);
 // sombra
 fx.save();fx.filter='blur(10px)';fx.fillStyle='rgba(0,0,0,.55)';fx.beginPath();
 for(let i=0;i<=N;i++){const[a,b]=P(i/N,0,t);i?fx.lineTo(a+18,b+26):fx.moveTo(a+18,b+26)}
 for(let i=N;i>=0;i--){const[a,b]=P(i/N,1,t);fx.lineTo(a+18,b+26)}
 fx.fill();fx.restore();
 // mastro
 const g=fx.createLinearGradient(36,0,52,0);g.addColorStop(0,'#6b6b70');g.addColorStop(.35,'#f2f2f4');g.addColorStop(.6,'#b9b9be');g.addColorStop(1,'#4a4a50');
 fx.fillStyle=g;fx.beginPath();fx.roundRect(36,54,16,420,8);fx.fill();
 for(let i=0;i<N;i++){const u0=i/N,u1=(i+1)/N,k=shade((u0+u1)/2,t);
  for(let j=0;j<M;j++){const v0=j/M,v1=(j+1)/M,cell=((i/S|0)+(j/S|0))%2;
   const c=cell===0?Math.round(Math.max(60,Math.min(255,245*k))):Math.round(Math.max(8,Math.min(90,22+(k-.86)*120)));
   const col='rgb('+c+','+c+','+Math.min(255,c+3)+')';fx.fillStyle=col;fx.strokeStyle=col;fx.lineWidth=1.2;
   const a=P(u0,v0,t),b=P(u1,v0,t),d=P(u1,v1,t),e=P(u0,v1,t);
   fx.beginPath();fx.moveTo(a[0],a[1]);fx.lineTo(b[0],b[1]);fx.lineTo(d[0],d[1]);fx.lineTo(e[0],e[1]);fx.closePath();fx.fill();fx.stroke()}}
 const rg=fx.createRadialGradient(38,44,2,44,50,18);rg.addColorStop(0,'#FFC08A');rg.addColorStop(.45,'#FF6A00');rg.addColorStop(1,'#8A3200');
 fx.fillStyle=rg;fx.beginPath();fx.arc(44,50,17,0,7);fx.fill();
}

/* ---------- raios ---------- */
const bc=document.getElementById('bolt'),bx=bc.getContext('2d'),flash=document.getElementById('flash'),logo=document.getElementById('logo');
let bolts=[],nextBolt=0;
addEventListener('resize',fit);fit();
function makeBolt(x,y,len,ang,w,depth){const pts=[[x,y]];let cx=x,cy=y,steps=14;
 for(let i=0;i<steps;i++){ang+=(Math.random()-.5)*.9;cx+=Math.cos(ang)*len/steps;cy+=Math.sin(ang)*len/steps;pts.push([cx,cy]);
  if(depth<2&&Math.random()<.18)bolts.push({pts:null,...makeBolt(cx,cy,len*.45,ang+(Math.random()-.5)*1.4,w*.55,depth+1)})}
 return{pts,w,life:1}}
function strike(){const n=1+Math.random()*2|0;
 for(let k=0;k<n;k++){const x=SW*.1+Math.random()*SW*.8;bolts.push(makeBolt(x,-20,700+Math.random()*500,Math.PI/2+(Math.random()-.5)*.6,5+Math.random()*4,0))}
 flash.style.transition='none';flash.style.opacity=.7;requestAnimationFrame(()=>{flash.style.transition='opacity .35s';flash.style.opacity=0});
 logo.classList.add('hit');setTimeout(()=>logo.classList.remove('hit'),160)}
function drawBolts(dt){bx.clearRect(0,0,SW,SH);
 bolts=bolts.filter(b=>b.pts&&(b.life-=dt*2.4)>0);
 for(const b of bolts){const f=Math.random()<.25?.3:1,a=b.life*f;
  bx.lineJoin='round';bx.lineCap='round';
  for(const[w,col,bl]of[[b.w*3,'rgba(255,106,0,'+(a*.22)+')',30],[b.w*1.1,'rgba(255,150,70,'+(a*.7)+')',14],[b.w*.4,'rgba(255,255,255,'+a+')',0]]){
   bx.shadowColor='#FF6A00';bx.shadowBlur=bl;bx.strokeStyle=col;bx.lineWidth=w;bx.beginPath();
   b.pts.forEach((p,i)=>i?bx.lineTo(p[0],p[1]):bx.moveTo(p[0],p[1]));bx.stroke()}}
 bx.shadowBlur=0}

/* ---------- confete laminado ---------- */
const cc=document.getElementById('confetti'),cx2=cc.getContext('2d');let dpr=Math.min(2,devicePixelRatio||1),CWd,CHt;
function rs(){CWd=innerWidth;CHt=innerHeight;cc.width=CWd*dpr;cc.height=CHt*dpr;cx2.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',rs);rs();
const COLS=[[255,106,0],[255,106,0],[255,255,255],[20,20,22],[200,200,206]];
let parts=[],nextBurst=0,side=0;
function burst(){const sc=Math.min(CWd,CHt)/1080,n=Math.min(90,Math.max(40,CWd/20|0));
 const from=side++%3;const pts=from===2?[[CWd*.25,CHt+10,-1],[CWd*.75,CHt+10,1]]:[[from?CWd+10:-10,CHt*.9,from?-1:1]];
 for(const[x,y,dir]of pts)for(let i=0;i<n;i++){
  const ang=from===2?(-Math.PI/2+dir*.25+(Math.random()-.5)*.7):(dir>0?-Math.PI/2+.55:-Math.PI/2-.55)+(Math.random()-.5)*.6;
  const sp=(14+Math.random()*12)*Math.max(.6,sc*1.2);
  parts.push({x,y,vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp,w:(6+Math.random()*6)*Math.max(.6,sc),h:(12+Math.random()*10)*Math.max(.6,sc),
   rot:Math.random()*6.3,vr:(Math.random()-.5)*.3,flip:Math.random()*6.3,vf:.15+Math.random()*.25,sway:Math.random()*6.3,c:COLS[Math.random()*COLS.length|0]})}
 if(parts.length>900)parts.splice(0,parts.length-900)}
function drawConfetti(dt){cx2.clearRect(0,0,CWd,CHt);const k=dt*60;
 parts=parts.filter(p=>p.y<CHt+60);
 for(const p of parts){p.vy+=.32*k;p.vx*=Math.pow(.985,k);p.vy*=Math.pow(.985,k);if(p.vy>3.2)p.vy=3.2+(p.vy-3.2)*.9;
  p.sway+=.05*k;p.x+=(p.vx+Math.sin(p.sway)*1.2)*k;p.y+=p.vy*k;p.rot+=p.vr*k;p.flip+=p.vf*k;
  const fl=Math.cos(p.flip),sh=.55+.45*Math.abs(Math.sin(p.flip*1.3+p.rot)),gl=Math.pow(Math.abs(fl),6);
  let[r,g,b]=p.c;r=Math.min(255,r*sh+gl*120);g=Math.min(255,g*sh+gl*120);b=Math.min(255,b*sh+gl*120);
  cx2.save();cx2.translate(p.x,p.y);cx2.rotate(p.rot);cx2.scale(1,fl);
  cx2.fillStyle='rgb('+(r|0)+','+(g|0)+','+(b|0)+')';cx2.fillRect(-p.w/2,-p.h/2,p.w,p.h);cx2.restore()}}

/* ---------- loop ---------- */
let last=performance.now(),T=0;
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;T+=dt;
 drawFlag(T);
 if(T>nextBolt){strike();nextBolt=T+2.2+Math.random()*2.4}
 drawBolts(dt);
 if(T>nextBurst){burst();nextBurst=T+2+Math.random()*.8}
 drawConfetti(dt);
 requestAnimationFrame(loop)}
requestAnimationFrame(loop);
</script>
</body>
</html>
